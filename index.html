<script>
/* CORE ADDITION: AUTO-TREND LOGIC 
   This function fetches NIFTY data and calculates if we are above the 20MA.
*/
let marketTrend = 'Neutral';

async function checkMarketRegime() {
    try {
        const data = await fetchPrice('^NSEI');
        const closes = data.dailyData.map(d => d.close);
        // Simple 20-day MA calculation
        const ma20 = closes.slice(-20).reduce((a,b) => a+b, 0) / 20;
        const lastPrice = closes[closes.length - 1];
        marketTrend = lastPrice > ma20 ? 'Bullish (Above 20MA)' : 'Bearish (Below 20MA)';
        console.log("Market Regime:", marketTrend);
    } catch(e) {
        console.error("Could not fetch market trend", e);
    }
}

// Update the saveTrade function to inject this market context
function saveTrade(){
  // ... (Keep existing validation logic)
  
  const trade={
    name, entry, qty, cmp,
    // ADDED: Auto-tagging the trade with the market trend at the moment of entry
    marketContext: marketTrend,
    ticker:(document.getElementById('fTicker').value.trim().toUpperCase())||'',
    sl:parseFloat(document.getElementById('fSL').value)||null,
    target:parseFloat(document.getElementById('fTarget').value)||null,
    exitPrice:parseFloat(document.getElementById('fExitPrice').value)||null,
    exchange:document.getElementById('fExchange').value,
    type:document.getElementById('fType').value,
    status:document.getElementById('fStatus').value,
    date:document.getElementById('fDate').value||new Date().toISOString().split('T')[0],
    exitDate:document.getElementById('fExitDate').value||'',
    setup:document.getElementById('fSetup').value||'',
    notes:document.getElementById('fNotes').value||''
  };
  
  // ... (Keep existing saving logic)
}

// Trigger this when the app loads
checkMarketRegime();
</script>
