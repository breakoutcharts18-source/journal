<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATM Journal – Analytics Engine</title>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<style>
/* (All previous CSS remains the same - Add this extra section for the Dashboard Grid) */
.analytics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 15px; }
.dash-card { background: var(--bg3); border-radius: var(--radius); padding: 15px; }
.dash-title { font-size: 11px; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
.dash-val { font-size: 18px; font-weight: 600; font-family: var(--mono); }
</style>
</head>
<body>
<div class="overlay" id="analyticsOverlay" onclick="closeAnalyticsBackdrop(event)">
  <div class="modal" style="width:900px; max-width:96vw;">
    <div class="modal-title">
      Advanced Analytics Engine
      <button class="modal-close" onclick="closeAnalytics()">✕</button>
    </div>
    
    <div class="analytics-grid">
        <div class="dash-card"><div class="dash-title">Equity Curve (Drawdown)</div><div id="curveChart" style="height:200px;"></div></div>
        <div class="dash-card"><div class="dash-title">Monthly Distribution</div><div id="monthlyChart" style="height:200px;"></div></div>
        <div class="dash-card">
            <div class="dash-title">Efficiency (Holding Time)</div>
            <table class="help-table">
                <tbody id="efficiencyBody"></tbody>
            </table>
        </div>
        <div class="dash-card">
            <div class="dash-title">Streak Counter</div>
            <div class="dash-val" id="streakVal">--</div>
            <div style="font-size:11px; color:var(--text3); margin-top:5px;" id="streakRecord"></div>
        </div>
    </div>
  </div>
</div>

<script>
/* ── ANALYTICS ENGINE ── */
function renderAnalytics() {
    renderEquityCurve();
    renderMonthlyChart();
    renderEfficiency();
    renderStreaks();
}

function renderEquityCurve() {
    const closed = trades.filter(t => t.status === 'closed' && t.exitDate).sort((a,b) => new Date(a.exitDate) - new Date(b.exitDate));
    let equity = 0; let series = []; let maxDrawdown = 0; let peak = 0;
    
    closed.forEach(t => {
        equity += exitPnlVal(t);
        if(equity > peak) peak = equity;
        let dd = peak > 0 ? (peak - equity) : 0;
        if(dd > maxDrawdown) maxDrawdown = dd;
        series.push({ x: new Date(t.exitDate).getTime(), y: equity });
    });

    const options = {
        series: [{ name: 'Equity', data: series }],
        chart: { type: 'area', height: 200, toolbar: { show: false } },
        theme: { mode: 'dark' },
        fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.7, opacityTo: 0.3 } },
        xaxis: { type: 'datetime', labels: { show: false } },
        tooltip: { theme: 'dark' }
    };
    new ApexCharts(document.querySelector("#curveChart"), options).render();
}

function renderMonthlyChart() {
    const months = {};
    trades.filter(t => t.status === 'closed').forEach(t => {
        const m = t.exitDate.substring(0, 7);
        if(!months[m]) months[m] = 0;
        months[m] += exitPnlVal(t);
    });
    
    const options = {
        series: [{ name: 'P&L', data: Object.values(months) }],
        chart: { type: 'bar', height: 200 },
        xaxis: { categories: Object.keys(months) },
        theme: { mode: 'dark' },
        plotOptions: { bar: { borderRadius: 4 } }
    };
    new ApexCharts(document.querySelector("#monthlyChart"), options).render();
}

function renderEfficiency() {
    const winners = trades.filter(t => t.status === 'closed' && exitPnlVal(t) > 0);
    const losers = trades.filter(t => t.status === 'closed' && exitPnlVal(t) < 0);
    
    const avgWinDays = winners.length ? (winners.reduce((a,t) => a + holdDays(t), 0) / winners.length).toFixed(1) : 0;
    const avgLossDays = losers.length ? (losers.reduce((a,t) => a + holdDays(t), 0) / losers.length).toFixed(1) : 0;
    
    document.getElementById('efficiencyBody').innerHTML = `
        <tr><td>Avg Win Hold</td><td>${avgWinDays} days</td></tr>
        <tr><td>Avg Loss Hold</td><td>${avgLossDays} days</td></tr>
    `;
}

function renderStreaks() {
    let current = 0; let record = 0;
    trades.filter(t => t.status === 'closed').sort((a,b) => new Date(a.exitDate) - new Date(b.exitDate)).forEach(t => {
        if(exitPnlVal(t) > 0) current++; else current = 0;
        if(current > record) record = current;
    });
    document.getElementById('streakVal').textContent = `${current} Win Streak`;
    document.getElementById('streakRecord').textContent = `All-time Record: ${record} wins`;
}
</script>
</body>
</html>
