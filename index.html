<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATM Journal – Final Engine</title>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root { --bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8eaf0;--text2:#8b93a8;--text3:#555f74;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b; }
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--bg2);border-bottom:1px solid var(--border);}
.main{padding:20px;}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px;}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-size:13px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);padding:20px;border-radius:12px;width:90%;max-width:800px;max-height:90vh;overflow-y:auto;}
.analytics-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}
</style>
</head>
<body>

<div class="topbar">
  <h3>ATM Journal</h3>
  <div style="margin-left:auto; display:flex; gap:10px;">
    <button class="btn" onclick="openAnalytics()">📊 Analytics</button>
    <button class="btn" onclick="exportCSV()">⬆ Export CSV</button>
    <button class="btn" onclick="document.getElementById('csvInput').click()">⬇ Import CSV</button>
    <button class="btn" onclick="openAddModal()">+ Add Trade</button>
  </div>
</div>

<input type="file" id="csvInput" style="display:none;" onchange="importCSV(event)" />

<div class="main">
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<div class="overlay" id="analyticsOverlay" onclick="this.classList.remove('open')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="analytics-grid">
      <div id="curveChart" style="height:200px;background:var(--bg3);"></div>
      <div id="monthlyChart" style="height:200px;background:var(--bg3);"></div>
      <div id="efficiencyBody" style="background:var(--bg3);padding:10px;"></div>
      <div id="streakVal" style="background:var(--bg3);padding:10px;"></div>
    </div>
  </div>
</div>

<div class="overlay" id="addOverlay" onclick="this.classList.remove('open')">
  <div class="modal" onclick="event.stopPropagation()">
    <input type="text" id="fName" placeholder="Stock Name" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg3);border:none;color:#fff;">
    <input type="number" id="fEntry" placeholder="Entry" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg3);border:none;color:#fff;">
    <input type="number" id="fQty" placeholder="Qty" style="width:100%;padding:10px;margin-bottom:10px;background:var(--bg3);border:none;color:#fff;">
    <input type="text" id="fSetup" list="setups" placeholder="Setup">
    <datalist id="setups"><option value="VCP Breakout"><option value="5MA Breakout"><option value="Pullback"></datalist>
    <button class="btn" onclick="saveTrade()">Save Trade</button>
  </div>
</div>

<script>
let trades = JSON.parse(localStorage.getItem('trades')) || [];

function saveTrade(){
    const t = {
        id: Date.now(),
        name: document.getElementById('fName').value,
        entry: parseFloat(document.getElementById('fEntry').value),
        qty: parseFloat(document.getElementById('fQty').value),
        setup: document.getElementById('fSetup').value,
        status: 'active',
        date: new Date().toISOString().split('T')[0]
    };
    trades.push(t);
    localStorage.setItem('trades', JSON.stringify(trades));
    location.reload();
}

function openAddModal(){ document.getElementById('addOverlay').classList.add('open'); }
function openAnalytics(){ document.getElementById('analyticsOverlay').classList.add('open'); renderAnalytics(); }

function renderAnalytics(){
    // Equity Curve Logic
    const series = trades.map((t,i) => ({x: i, y: t.entry * t.qty}));
    new ApexCharts(document.querySelector("#curveChart"), { series: [{data:series}], chart: {type:'area'} }).render();
}

function exportCSV(){
    const csv = "Name,Entry,Qty,Setup\n" + trades.map(t => `${t.name},${t.entry},${t.qty},${t.setup}`).join('\n');
    const a = document.createElement('a'); a.href = 'data:text/csv,'+encodeURIComponent(csv); a.download='trades.csv'; a.click();
}

function importCSV(e){
    const reader = new FileReader();
    reader.onload = (f) => {
        const lines = f.target.result.split('\n').slice(1);
        lines.forEach(l => {
            const [name, entry, qty, setup] = l.split(',');
            if(name) trades.push({id:Date.now(), name, entry, qty, setup, status:'closed'});
        });
        localStorage.setItem('trades', JSON.stringify(trades));
        location.reload();
    };
    reader.readAsText(e.target.files[0]);
}

// Initial Render
trades.forEach(t => {
    document.getElementById('cardsGrid').innerHTML += `<div style="background:var(--bg2);padding:15px;">${t.name} - ${t.entry}</div>`;
});
</script>
</body>
</html>
